<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Park Quotes</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="icons.png" alt="South Park kids">
    <h1>SOUTH PARK <small>Quotes!</small></h1>
  </header>

  <main>
  <div class="stage">
    <button class="bubble" id="bubble" aria-live="polite" aria-label="Show another random quote">
      <p class="quote" id="quote"></p>
      <span class="who" id="who"></span>
    </button>
    <button class="go" id="go">Random Quote!</button>
  </div>
  </main>

  <footer>quotes from the <a href="https://github.com/Thatskat/southpark-quotes-api">South Park API</a></footer>

<script>
  const API = "https://southparkquotes.onrender.com/v1/quotes";
  const bubble = document.getElementById("bubble");
  const quoteEl = document.getElementById("quote");
  const whoEl = document.getElementById("who");
  const goBtn = document.getElementById("go");
  let busy = false, lastQuote = "";

  async function getQuote() {
    if (busy) return;
    busy = true; goBtn.disabled = true;
    bubble.classList.remove("error"); bubble.classList.add("loading");
    quoteEl.textContent = "Loading… the server may take a few seconds to wake up.";
    whoEl.textContent = "";
    try {
      // Fetch again if the API returns the same quote twice in a row.
      let item;
      for (let i = 0; i < 3; i++) {
        const res = await fetch(API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        item = Array.isArray(data) ? data[0] : data;
        if (item && item.quote !== lastQuote) break;
      }
      if (!item || !item.quote) throw new Error("Empty response");
      lastQuote = item.quote;
      quoteEl.textContent = "\u201C" + item.quote + "\u201D";
      whoEl.textContent = item.character || "";
      bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
    } catch (err) {
      bubble.classList.add("error");
      quoteEl.textContent = "Couldn't reach the quotes API. Check your connection and click to try again.";
      console.error(err);
    } finally {
      bubble.classList.remove("loading");
      busy = false; goBtn.disabled = false;
    }
  }

  bubble.addEventListener("click", getQuote);
  goBtn.addEventListener("click", getQuote);
</script>
</body>
</html>
